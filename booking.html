<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="bilder/minipawbackground.png">
    <title>Booking - Purr &amp; Pour</title>
    <link rel="stylesheet" href="style.css">
    <script src="nav.js" defer></script>
    <script src="footer.js" defer></script>
    <script src="booking.js" defer></script>
</head>
<body>
    <header id="site-header"></header>

    <main class="page">
        <h1>Booking</h1>

        <form class="booking-form">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" placeholder="First name" required>

            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Last name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>

            <label for="bookDate">Select date</label>
            <input type="date" id="bookDate" name="bookDate" required>

            <label for="time">Select time</label>
            <input type="time" id="time" name="time" step="900" min="11:00" required>

            <label for="people">Number of guests</label>
            <select id="people" name="people" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>

            <button id="submit" type="submit">Book a table</button>
        </form>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
